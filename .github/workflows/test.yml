name: Tests

# Plus's own suite on all three desktop platforms, then the configs the app
# writes — the Server tab's and the scanner's — through `xray run -test` on the
# suggested cores (the ones a download installs; MASQUE needs them), and the
# reverse proxy and a real scan proven end to end on loopback.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node --test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test "tests/*.test.js"` needs glob support (Node 21).
          node-version: '22'
      # No `npm ci` on purpose — the tests use only Node core modules.
      - run: npm test

  cores:
    name: cores accept the configs (suggested versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the suggested cores
        run: |
          set -e
          XV=$(node -p "require('./src/main/coreVersions').SUGGESTED.xray")
          PV=$(node -p "require('./src/main/coreVersions').SUGGESTED['xray-pattn']")
          echo "xray $XV · xray-pattn $PV"
          curl -fsSL --retry 3 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v$XV/Xray-linux-64.zip"
          unzip -q x.zip -d "$RUNNER_TEMP/x"
          curl -fsSL --retry 3 -o p.zip "https://github.com/patterniha/Xray-core/releases/download/v$PV/Xray-linux-64.zip"
          unzip -q p.zip -d "$RUNNER_TEMP/p"
          chmod +x "$RUNNER_TEMP/x/xray" "$RUNNER_TEMP/p/xray"
          # the probes start their cores the way the app does: from bin/
          mkdir -p bin
          cp "$RUNNER_TEMP/x/xray" bin/xray
          cp "$RUNNER_TEMP/p/xray" bin/xray-pattn
          cp "$RUNNER_TEMP/x/geoip.dat" "$RUNNER_TEMP/x/geosite.dat" bin/ 2>/dev/null || true
      - name: Xray (suggested) accepts every config
        run: IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" node scripts/validate-configs.js
      - name: Xray-PattN (suggested) accepts every config, its own scan shapes included
        # IRNF_XRAY_FORK: this core file is named xray, so the script is told it is the
        # fork — the merge-mask and ClientHello-split scan shapes run only here.
        run: IRNF_XRAY_FORK=pattn IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" node scripts/validate-configs.js
      - name: The reverse proxy carries a page, both cores (loopback)
        run: node scripts/probe-reverse.js
      - name: A scan finds the one good target among dead ones, both cores (loopback)
        run: node scripts/probe-scan.js
